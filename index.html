<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexiTime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="display" content="standalone">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
            <div class="flex items-center gap-3">
                <div class="bg-sky-500 text-white p-2.5 rounded-lg">
                    <i class="fa-solid fa-clock text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">FlexiTime</h1>
                    <p class="text-xs text-slate-500">Flexi-Hours Tracker & Home Calculator</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleSettings()" class="bg-slate-100 text-xs text-slate-600 px-3 py-1.5 rounded-full flex items-center gap-1.5 font-medium hover:bg-slate-200">
                    <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span id="syncStatus">Synced</span>
                    <i class="fa-solid fa-gear text-slate-400"></i>
                </button>
                
                <!-- Live Clock & Date Display -->
                <div class="text-right border-l pl-3 border-slate-200">
                    <div id="headerLiveClock" class="text-xs font-bold font-mono text-slate-700 leading-tight">--:--:-- --</div>
                    <div id="headerLiveDate" class="text-[10px] text-slate-400 font-medium leading-tight">--/--/----</div>
                </div>
            </div>
        </div>

        <!-- Settings Modal/Panel -->
        <div id="settingsPanel" class="hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h3 class="font-semibold text-sm">Google Apps Script Web App URL</h3>
            <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-xs p-2 border border-slate-300 rounded-lg">
            <button onclick="saveScriptUrl()" class="bg-sky-600 text-white text-xs px-4 py-2 rounded-lg font-medium w-full">Save Connection URL</button>
        </div>

        <!-- Shift Dashboard -->
        <div class="bg-white p-6 rounded-2xl shadow-sm space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-briefcase text-sky-600"></i> Shift Dashboard
                </h2>
                <span id="statusBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
                    Not Clocked In
                </span>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <span class="text-xs font-medium text-slate-400 block mb-1">Clocked In Time</span>
                    <div id="clockInDisplay" class="text-xl font-bold text-slate-700">-- : --</div>
                </div>
                <div class="bg-sky-50/50 p-4 rounded-xl border border-sky-100">
                    <span class="text-xs font-medium text-sky-600/70 block mb-1">Clock Out Time</span>
                    <div id="clockOutDisplay" class="text-xl font-bold text-sky-600">-- : --</div>
                </div>
            </div>

            <div class="space-y-1.5">
                <div class="flex justify-between text-xs text-slate-500 font-medium">
                    <span>Workday Progress</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-sky-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="flex gap-2">
                <button id="mainActionButton" onclick="handleMainAction()" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-xl shadow-sm transition">
                    Clock In Now
                </button>
                <button onclick="resetShift()" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-4 py-3 rounded-xl font-medium text-sm border border-amber-200/50">
                    <i class="fa-solid fa-power-off"></i>
                </button>
                <button onclick="syncDataFromCloud()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-3 rounded-xl font-medium text-sm">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <!-- Toggle Advanced Panels Button -->
        <div class="flex justify-center">
            <button onclick="toggleAdvanced()" class="text-xs font-semibold text-slate-500 bg-slate-200/60 hover:bg-slate-200 px-4 py-2 rounded-lg flex items-center gap-1.5 cursor-pointer">
                <span id="advancedToggleText">Show Advanced Panels</span>
                <i id="advancedToggleIcon" class="fa-solid fa-chevron-down"></i>
            </button>
        </div>

        <!-- Advanced Panels Container -->
        <div id="advancedPanels" class="hidden space-y-6">
            <!-- Manual Entry / Override -->
            <div class="bg-white p-5 rounded-xl shadow-sm space-y-4">
                <h3 class="font-bold text-sm text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-sky-600"></i> Manual Entry / Override
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs font-medium text-slate-500 mb-1 block">Clock In Time</label>
                        <input type="time" id="manualClockIn" class="w-full text-xs p-2.5 border border-slate-200 rounded-lg">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-slate-500 mb-1 block">Clock Out Time</label>
                        <input type="time" id="manualClockOut" class="w-full text-xs p-2.5 border border-slate-200 rounded-lg">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-slate-500 mb-1 block">Date</label>
                        <input type="date" id="manualDate" class="w-full text-xs p-2.5 border border-slate-200 rounded-lg">
                    </div>
                </div>
                <button onclick="submitManualEntry()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2.5 rounded-lg text-xs">
                    Set Active Shift / Submit
                </button>
            </div>

            <!-- Clock History Log -->
            <div class="bg-white p-5 rounded-xl shadow-sm space-y-4">
                <h3 class="font-bold text-sm text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-list text-sky-600"></i> Clock History Log
                </h3>
