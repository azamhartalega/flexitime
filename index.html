<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexiTime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="display" content="standalone">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
            <div class="flex items-center gap-3">
                <div class="bg-sky-500 text-white p-2.5 rounded-lg">
                    <i class="fa-solid fa-clock text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">FlexiTime</h1>
                    <p class="text-xs text-slate-500">Flexi-Hours Tracker & Home Calculator</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleSettings()" class="bg-slate-100 text-xs text-slate-600 px-3 py-1.5 rounded-full flex items-center gap-1.5 font-medium hover:bg-slate-200">
                    <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span id="syncStatus">Synced</span>
                    <i class="fa-solid fa-gear text-slate-400"></i>
                </button>
            </div>
        </div>

        <!-- Settings Modal/Panel -->
        <div id="settingsPanel" class="hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h3 class="font-semibold text-sm">Google Apps Script Web App URL</h3>
            <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-xs p-2 border border-slate-300 rounded-lg">
            <button onclick="saveScriptUrl()" class="bg-sky-600 text-white text-xs px-4 py-2 rounded-lg font-medium w-full">Save Connection URL</button>
        </div>

        <!-- Shift Dashboard -->
        <div class="bg-white p-6 rounded-2xl shadow-sm space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-briefcase text-sky-600"></i> Shift Dashboard
                </h2>
                <span id="statusBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
                    Not Clocked In
                </span>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <span class="text-xs font-medium text-slate-400 block mb-1">Clocked In Time</span>
                    <div id="clockInDisplay" class="text-xl font-bold text-slate-700">-- : --</div>
                </div>
                <div class="bg-sky-50/50 p-4 rounded-xl border border-sky-100">
                    <span class="text-xs font-medium text-sky-600/70 block mb-1">Clock Out Time</span>
                    <div id="clockOutDisplay" class="text-xl font-bold text-sky-600">-- : --</div>
                </div>
            </div>

            <div class="space-y-1.5">
                <div class="flex justify-between text-xs text-slate-500 font-medium">
                    <span>Workday Progress</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-sky-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="flex gap-2">
                <button id="mainActionButton" onclick="handleMainAction()" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-xl shadow-sm transition">
                    Clock In Now
                </button>
                <button onclick="resetShift()" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-4 py-3 rounded-xl font-medium text-sm border border-amber-200/50">
                    <i class="fa-solid fa-power-off"></i>
                </button>
                <button onclick="syncDataFromCloud()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-3 rounded-xl font-medium text-sm">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <!-- Toggle Advanced Panels -->
        <div class="flex justify-center">
            <button onclick="toggleAdvanced()" class="text-xs font-semibold text-slate-500 bg-slate-200/60 hover:bg-slate-200 px-4 py-2 rounded-lg flex items-center gap-1.5">
                <span id="advancedToggleText">Show Advanced Panels</span>
                <i id="advancedToggleIcon" class="fa-solid fa-chevron-down"></i>
            </button>
        </div>

        <!-- Advanced Panels Container -->
        <div id="advancedPanels" class="hidden space-y-6">
            <!-- Manual Entry / Override -->
            <div class="bg-white p-5 rounded-xl shadow-sm space-y-4">
                <h3 class="font-bold text-sm text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-sky-600"></i> Manual Entry / Override
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs font-medium text-slate-500 mb-1 block">Clock In Time</label>
                        <input type="time" id="manualClockIn" class="w-full text-xs p-2.5 border border-slate-200 rounded-lg">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-slate-500 mb-1 block">Clock Out Time</label>
                        <input type="time" id="manualClockOut" class="w-full text-xs p-2.5 border border-slate-200 rounded-lg">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-slate-500 mb-1 block">Date</label>
                        <input type="date" id="manualDate" class="w-full text-xs p-2.5 border border-slate-200 rounded-lg">
                    </div>
                </div>
                <button onclick="submitManualEntry()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2.5 rounded-lg text-xs">
                    Set Active Shift / Submit
                </button>
            </div>

            <!-- Clock History Log -->
            <div class="bg-white p-5 rounded-xl shadow-sm space-y-4">
                <h3 class="font-bold text-sm text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-list text-sky-600"></i> Clock History Log
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="text-slate-400 font-medium border-b border-slate-100">
                            <tr>
                                <th class="py-2 px-2">Date</th>
                                <th class="py-2 px-2">Clock In</th>
                                <th class="py-2 px-2">Clock Out</th>
                                <th class="py-2 px-2">Total Worked</th>
                                <th class="py-2 px-2 text-right">Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="5" class="py-4 text-center text-slate-400">No records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let webAppUrl = localStorage.getItem('webAppUrl') || '';
        let activeShift = JSON.parse(localStorage.getItem('activeShift')) || null;

        document.getElementById('scriptUrlInput').value = webAppUrl;

        // Set default manual date input to today
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('manualDate').value = todayStr;

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('hidden');
        }

        function saveScriptUrl() {
            webAppUrl = document.getElementById('scriptUrlInput').value.trim();
            localStorage.setItem('webAppUrl', webAppUrl);
            toggleSettings();
            syncDataFromCloud();
        }

        function toggleAdvanced() {
            const panel = document.getElementById('advancedPanels');
            const text = document.getElementById('advancedToggleText');
            const icon = document.getElementById('advancedToggleIcon');
            panel.classList.toggle('hidden');
            if (panel.classList.contains('hidden')) {
                text.textContent = 'Show Advanced Panels';
                icon.className = 'fa-solid fa-chevron-down';
            } else {
                text.textContent = 'Hide Advanced Panels';
                icon.className = 'fa-solid fa-chevron-up';
            }
        }

        // Always converts dates to DD/MM/YYYY for Google Sheets compatibility
        function formatToDDMMYYYY(dateObjStr) {
            if (!dateObjStr) return '';
            if (dateObjStr.includes('/')) return dateObjStr;
            const parts = dateObjStr.split('-');
            if (parts.length === 3 && parts[0].length === 4) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            const d = new Date(dateObjStr);
            if (!isNaN(d.getTime())) {
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                return `${day}/${month}/${d.getFullYear()}`;
            }
            return dateObjStr;
        }

        function formatTime12H(timeStr) {
            if (!timeStr || timeStr === '--') return '-- : --';
            if (timeStr.includes('AM') || timeStr.includes('PM')) return timeStr;
            const [h, m] = timeStr.split(':');
            let hours = parseInt(h, 10);
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${String(hours).padStart(2, '0')}:${m} ${ampm}`;
        }

        function handleMainAction() {
            if (!activeShift) {
                // Clock In Action
                const now = new Date();
                const timeStr = formatTime12H(`${now.getHours()}:${now.getMinutes()}`);
                const dateStr = formatToDDMMYYYY(now.toISOString().split('T')[0]);

                activeShift = { date: dateStr, clockIn: timeStr, clockOut: '--', status: 'In Progress' };
                localStorage.setItem('activeShift', JSON.stringify(activeShift));
                
                sendPayload({ action: 'clockIn', date: dateStr, clockIn: timeStr });
                updateUI();
            } else {
                // Clock Out Action
                const now = new Date();
                const timeStr = formatTime12H(`${now.getHours()}:${now.getMinutes()}`);
                
                sendPayload({ action: 'clockOut', date: activeShift.date, clockOut: timeStr });
                activeShift = null;
                localStorage.removeItem('activeShift');
                updateUI();
            }
        }

        function submitManualEntry() {
            const inVal = document.getElementById('manualClockIn').value;
            const outVal = document.getElementById('manualClockOut').value;
            const dateVal = document.getElementById('manualDate').value;

            if (!dateVal) return;

            const formattedDate = formatToDDMMYYYY(dateVal);
            const formattedIn = inVal ? formatTime12H(inVal) : '--';
            const formattedOut = outVal ? formatTime12H(outVal) : '--';

            if (inVal && !outVal) {
                activeShift = { date: formattedDate, clockIn: formattedIn, clockOut: '--', status: 'In Progress' };
                localStorage.setItem('activeShift', JSON.stringify(activeShift));
                sendPayload({ action: 'clockIn', date: formattedDate, clockIn: formattedIn });
            } else {
                sendPayload({ action: 'clockOut', date: formattedDate, clockIn: formattedOut });
            }
            updateUI();
        }

        function sendPayload(payload) {
            if (!webAppUrl) return;
            fetch(webAppUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(() => {
                setTimeout(syncDataFromCloud, 1000);
            }).catch(e => console.error(e));
        }

        function syncDataFromCloud() {
            if (!webAppUrl) return;
            fetch(webAppUrl)
                .then(r => r.json())
                .then(data => {
                    const logs = Array.isArray(data) ? data : (data.logs || data.data || []);
                    if (logs && logs.length > 0) {
                        renderHistoryTable(logs);
                    }
                })
                .catch(e => console.error(e));
        }

        function renderHistoryTable(rows) {
            const tbody = document.getElementById('historyTableBody');
            if (!tbody || !rows) return;
            tbody.innerHTML = rows.map(r => `
                <tr class="hover:bg-slate-50">
                    <td class="py-2.5 px-2 font-medium">${r.date}</td>
                    <td class="py-2.5 px-2 text-emerald-600 font-semibold">${r.clockIn || '--'}</td>
                    <td class="py-2.5 px-2 text-rose-600 font-semibold">${r.clockOut || '--'}</td>
                    <td class="py-2.5 px-2 font-bold">${r.totalWorked || '--'}</td>
                    <td class="py-2.5 px-2 text-right">
                        <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${r.status === 'In Progress' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">
                            ${r.status}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function parse12HToMinutes(timeStr) {
    if (!timeStr || timeStr === '-- : --' || timeStr === '--') return null;
    const match = timeStr.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
    if (!match) return null;
    
    let hours = parseInt(match[1], 10);
    const minutes = parseInt(match[2], 10);
    const ampm = match[3] ? match[3].toUpperCase() : null;

    if (ampm === 'PM' && hours < 12) hours += 12;
    if (ampm === 'AM' && hours === 12) hours = 0;

    return hours * 60 + minutes;
}

function updateUI() {
    const statusBadge = document.getElementById('statusBadge');
    const clockInDisplay = document.getElementById('clockInDisplay');
    const clockOutDisplay = document.getElementById('clockOutDisplay');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const btn = document.getElementById('mainActionButton');

    if (activeShift) {
        statusBadge.textContent = 'Shift In Progress';
        statusBadge.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-700';
        clockInDisplay.textContent = activeShift.clockIn;
        clockOutDisplay.textContent = '04:40 PM';
        btn.textContent = 'Clock Out Now';
        btn.className = 'flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-xl shadow-sm transition';

        // Progress Calculation: (Current Time - Clock In Time) / Target Duration
        const startMins = parse12HToMinutes(activeShift.clockIn);
        
        if (startMins !== null) {
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            
            // Elapsed time since clock in
            const elapsedMins = currentMins - startMins;

            // Target shift duration in minutes (e.g., 9 hours = 540 mins including break)
            const targetDurationMins = 9 * 60; 

            let percentage = 0;
            if (elapsedMins > 0) {
                percentage = Math.min(100, Math.max(0, Math.round((elapsedMins / targetDurationMins) * 100)));
            }

            progressBar.style.width = percentage + '%';
            progressPercent.textContent = percentage + '%';
        }
    } else {
        statusBadge.textContent = 'Not Clocked In';
        statusBadge.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600';
        clockInDisplay.textContent = '-- : --';
        clockOutDisplay.textContent = '-- : --';
        progressBar.style.width = '0%';
        progressPercent.textContent = '0%';
        btn.textContent = 'Clock In Now';
        btn.className = 'flex-1 bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-xl shadow-sm transition';
    }
}

        function resetShift() {
            activeShift = null;
            localStorage.removeItem('activeShift');
            updateUI();
        }

        // Initial sync on load
        updateUI();
        syncDataFromCloud();
    </script>
</body>
</html>
